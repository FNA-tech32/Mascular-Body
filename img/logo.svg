<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 45" width="240" height="45" fill="none">
  <!-- Logo Icon: Hexagon / Shield with Stylized Barbell 'M' -->
  <g transform="translate(4, 3)">
    <!-- Outer Hex Shield in Gym Red -->
    <path d="M19 1 L35 10 L35 29 L19 38 L3 29 L3 10 Z" fill="#e23e38" />
    <!-- Inner Dark Accent Shield -->
    <path d="M19 4 L32 11.5 L32 27.5 L19 35 L6 27.5 L6 11.5 Z" fill="#1f1f1f" />
    <!-- Barbell Plate / 'M' Wings inside emblem -->
    <!-- Central Barbell Weight Plates -->
    <rect x="8" y="16" width="3" height="7" rx="1" fill="#ffffff" />
    <rect x="13" y="14" width="3" height="11" rx="1" fill="#e23e38" />
    <!-- Barbell Shaft -->
    <rect x="11" y="18" width="16" height="3" rx="1" fill="#ffffff" />
    <!-- Right Plates -->
    <rect x="22" y="14" width="3" height="11" rx="1" fill="#e23e38" />
    <rect x="27" y="16" width="3" height="7" rx="1" fill="#ffffff" />
    <!-- Dynamic Peak Icon Accent -->
    <polygon points="19,8 23,13 15,13" fill="#e23e38" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(48, 0)">
    <!-- "MASCULAR" in Crisp White -->
    <text x="0" y="27" font-family="'Oswald', 'Montserrat', sans-serif" font-size="22" font-weight="800" letter-spacing="1.5" fill="#ffffff">
      MASCULAR
    </text>
    <!-- "BODY" in Energetic Accent Red -->
    <text x="112" y="27" font-family="'Oswald', 'Montserrat', sans-serif" font-size="22" font-weight="800" letter-spacing="1.5" fill="#e23e38">
      BODY
    </text>
    <!-- Tagline below -->
    <text x="1" y="38" font-family="'Open Sans', sans-serif" font-size="7.5" font-weight="700" letter-spacing="3.2" fill="#aaaaaa">
      FITNESS &amp; GYMNASIUM
    </text>
  </g>
</svg>
